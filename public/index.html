<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI & ML Service Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(23, 31, 51, 0.7);
      --accent: #00f2fe;
      --accent-purple: #7f00ff;
      --text: #f3f4f6;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 900px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(0, 242, 254, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 30px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .card h3 {
      font-size: 2rem;
      margin: 10px 0 0 0;
      color: var(--accent);
    }
    .card p {
      margin: 5px 0 0 0;
      font-size: 0.9rem;
      color: #9ca3af;
    }
    .btn {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 28px;
      background: linear-gradient(135deg, var(--accent), var(--accent-purple));
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3);
      transition: transform 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 ML Predictive Service Dashboard</h1>
    <div class="badge">Vercel Production Deployment v1.0.0</div>
    <p>Real-time Machine Learning model monitoring and API metrics pipeline.</p>
    
    <div class="grid">
      <div class="card">
        <h3>94.8%</h3>
        <p>Model Accuracy</p>
      </div>
      <div class="card">
        <h3>0.952</h3>
        <p>Precision Score</p>
      </div>
      <div class="card">
        <h3>1.8 ms</h3>
        <p>Inference Latency</p>
      </div>
      <div class="card">
        <h3>50k+</h3>
        <p>Training Datasets</p>
      </div>
    </div>

    <a href="/api/metrics" class="btn">View Live API Metrics</a>
  </div>
</body>
</html>
